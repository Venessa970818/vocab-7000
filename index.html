<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7000單字 - 無印風</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 1. 顏色 (核心四色與介面用色) */
            --color-primary: #7f0019;    /* 主色 (無印紅) */
            --color-secondary: #b8997a;  /* 輔色 (木質調) */
            --color-bg: #f9f8f6;         /* 背景色 */
            --color-text: #3e3a39;       /* 文字色 */
            
            --color-card-bg: rgba(255, 255, 255, 0.65);
            --color-card-hover: rgba(255, 255, 255, 0.85);
            --color-border: rgba(224, 220, 211, 0.6);
            
            /* 2. 字級 (4 級) */
            --text-sm: 14px;
            --text-base: 16px;
            --text-lg: 24px;
            --text-xl: 40px;
            
            /* 3. 圓角 (2 種) */
            --radius-sm: 4px;
            --radius-md: 8px;
            
            /* 4. 陰影 (2 種) */
            --shadow-glass-1: 0 8px 32px rgba(0,0,0,0.06);
            --shadow-glass-2: 0 1px 2px rgba(255,255,255,0.4) inset, 0 -1px 2px rgba(0,0,0,0.02) inset;
            
            /* 5. 間距 (4 的倍數) */
            --space-0: 0;
            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            --space-40: 40px;
            --space-48: 48px;
            --space-320: 320px;
            
            /* 其他共用尺寸 */
            --border-width: 1px;
            --letter-spacing-sm: 1px;
            --letter-spacing-md: 2px;
            --opacity-muted: 0.6;
        }

        * { box-sizing: border-box; }
        
        /* 1. 極淡雜訊質感 (SVG Filter via CSS) */
        body::after {
            content: "";
            position: fixed;
            top: var(--space-0); left: var(--space-0); width: 100vw; height: 100vh;
            z-index: 9999;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
        }

        /* 2. 模糊漸層光暈 + 4. 視差滾動效果 */
        .glow-bg {
            position: fixed; /* Desktop parallax: fixed behind scrolling content */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vw;
            max-width: 600px; max-height: 600px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 60%);
            opacity: 0.15;
            filter: blur(60px);
            z-index: -1;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .glow-bg {
                /* 手機關閉視差：改成 absolute 跟著滾動 */
                position: absolute;
                top: 200px;
            }
        }

        #bg-canvas {
            position: fixed;
            top: var(--space-0);
            left: var(--space-0);
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }
        body {
            margin: var(--space-0);
            padding: var(--space-0);
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            margin: var(--space-40) var(--space-0);
        }
        h1 {
            font-weight: 700;
            font-size: var(--text-xl);
            margin-bottom: var(--space-4);
            color: var(--color-primary);
            letter-spacing: var(--letter-spacing-md);
        }
        .subtitle {
            opacity: var(--opacity-muted);
            margin-bottom: var(--space-40);
            font-size: var(--text-sm);
            font-weight: 300;
            letter-spacing: var(--letter-spacing-sm);
        }
        
        .screen {
            display: none;
            width: 100%;
        }
        .screen.active {
            display: block;
        }
        
        /* Loading */
        #loading {
            font-size: var(--text-base);
            opacity: var(--opacity-muted);
            margin: var(--space-48) var(--space-0);
        }

        /* Level Selection */
        .level-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-16);
        }
        
        /* Level Card */
        .level-card {
            background: var(--color-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--border-width) solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-glass-1), var(--shadow-glass-2);
            overflow: hidden;
            text-align: left;
        }
        .level-main {
            padding: var(--space-20) var(--space-24);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .level-main:hover {
            background: var(--color-card-hover);
        }
        .level-main.completed {
            background: var(--color-card-hover);
        }
        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--text-base);
            font-weight: 500;
            color: var(--color-text);
        }
        .progress-text {
            font-size: var(--text-sm);
            opacity: var(--opacity-muted);
            font-weight: 400;
        }
        .progress-bar-bg {
            background: var(--color-border);
            height: var(--space-4);
            border-radius: var(--radius-sm);
            margin-top: var(--space-12);
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--color-secondary);
            width: 0%;
            transition: width 0.5s ease;
        }
        .level-main.completed .progress-bar-fill {
            background: var(--color-secondary);
        }
        
        .level-hard {
            border-top: var(--border-width) dashed var(--color-border);
            background: var(--color-bg);
            padding: var(--space-16) var(--space-24);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .level-hard:hover {
            opacity: 0.8;
        }
        .hard-text {
            font-size: var(--text-sm);
            color: var(--color-primary);
            font-weight: 500;
        }
        .btn-small {
            background: var(--color-card-bg);
            border: var(--border-width) solid var(--color-border);
            padding: var(--space-8) var(--space-12);
            font-size: var(--text-sm);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            cursor: pointer;
            pointer-events: none;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-24);
        }
        .btn-icon {
            background: transparent;
            border: var(--border-width) solid var(--color-border);
            color: var(--color-text);
            opacity: 0.7;
            font-size: var(--text-sm);
            cursor: pointer;
            padding: var(--space-8) var(--space-12);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .btn-icon:hover {
            background: var(--color-border);
            opacity: 1;
        }
        .session-progress {
            font-size: var(--text-sm);
            color: var(--color-secondary);
            font-weight: 500;
        }

        /* Card 3D Flip */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: var(--space-320);
            margin: var(--space-0) auto var(--space-32) auto;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            padding: var(--space-32);
            background: var(--color-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--border-width) solid var(--color-border);
            box-shadow: var(--shadow-glass-1), var(--shadow-glass-2);
            overflow-y: auto;
        }
        .card-back {
            transform: rotateY(180deg);
            background: var(--color-bg);
            align-items: flex-start;
            justify-content: flex-start;
        }
        .word-en {
            font-size: var(--text-xl);
            font-weight: 700;
            margin-bottom: var(--space-16);
            color: var(--color-text);
            word-wrap: break-word;
            text-align: center;
            width: 100%;
        }
        .word-zh-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .word-zh {
            font-size: var(--text-lg);
            font-weight: 500;
            color: var(--color-text);
            margin-bottom: var(--space-8);
        }
        .word-pos {
            font-size: var(--text-sm);
            opacity: var(--opacity-muted);
            margin-bottom: var(--space-4);
        }
        .hint-text {
            position: absolute;
            bottom: var(--space-20);
            font-size: var(--text-sm);
            opacity: 0.5;
            font-weight: 400;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Actions */
        .actions {
            display: flex;
            gap: var(--space-16);
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            transform: translateY(var(--space-12));
        }
        .actions.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(var(--space-0));
        }
        .btn-action {
            flex: 1;
            padding: var(--space-16);
            border: var(--border-width) solid transparent;
            border-radius: var(--radius-sm);
            font-size: var(--text-base);
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            letter-spacing: var(--letter-spacing-sm);
        }
        .btn-danger {
            background: var(--color-primary);
            color: var(--color-card-bg);
        }
        .btn-danger:hover { opacity: 0.8; }
        
        .btn-success {
            background: var(--color-secondary);
            color: var(--color-card-bg);
        }
        .btn-success:hover { opacity: 0.8; }

        .complete-msg {
            font-size: var(--text-lg);
            margin-bottom: var(--space-24);
            color: var(--color-text);
            line-height: 1.6;
        }
        
        .box {
            background: var(--color-card-bg);
            border: var(--border-width) solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-40) var(--space-20);
        }
        
        /* Custom scrollbar */
        .card-back::-webkit-scrollbar {
            width: var(--space-8);
        }
        .card-back::-webkit-scrollbar-thumb {
            background-color: var(--color-border);
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="glow-bg"></div>
<div class="container">
    <!-- Level Selection Screen -->
    <div id="level-screen" class="screen active">
        <h1>單字本</h1>
        <div class="subtitle">高中 7000 詞彙</div>
        
        <div class="top-bar" style="justify-content: flex-end;">
            <button class="btn-icon" onclick="resetAllProgress()">清除記錄</button>
        </div>

        <div id="loading">正在從雲端載入 7000 詞彙資料中...</div>
        <div class="level-grid" id="level-grid" style="display: none;">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Flashcard Screen -->
    <div id="card-screen" class="screen">
        <div class="top-bar">
            <button class="btn-icon" onclick="goHome()">回首頁</button>
            <div class="session-progress" id="session-progress">剩餘 0 字</div>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="word-en" id="word-en">Word</div>
                    <div class="hint-text">點擊翻轉</div>
                </div>
                <div class="card-face card-back" id="card-back-content">
                    <div class="word-zh-container" id="word-zh-container"></div>
                </div>
            </div>
        </div>

        <div class="actions" id="actions">
            <button class="btn-action btn-danger" onclick="handleAnswer(false)">不熟</button>
            <button class="btn-action btn-success" onclick="handleAnswer(true)">記得</button>
        </div>
    </div>

    <!-- Complete Screen -->
    <div id="complete-screen" class="screen box">
        <div class="complete-msg">本次複習單字已全數完成。<br>辛苦了！</div>
        <button class="btn-action btn-icon" style="width: 100%; font-size: 1rem; padding: 12px; border: 1px solid var(--border-color); background: var(--bg-main);" onclick="goHome()">返回列表</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    let vocabulary = [];
    // progress storage format: { 'apple': { memorized: true }, 'banana': { hard: true } }
    // if 'apple' was just `true` (legacy format), we treat it as { memorized: true }
    let progress = JSON.parse(localStorage.getItem('vocab_progress_v2') || '{}');
    let reviewQueue = [];
    let currentWord = null;
    let isAnimating = false;
    let dataLoaded = false;
    let hasAnimatedTitle = false;
    let hasAnimatedLevels = false;

    // Load 7000 words from JSONs
    async function loadData() {
        const baseUrl = 'https://raw.githubusercontent.com/AppPeterPan/TaiwanSchoolEnglishVocabulary/main/';
        try {
            const fetchPromises = [];
            for (let i = 1; i <= 6; i++) {
                fetchPromises.push(
                    fetch(`${baseUrl}${i}%E7%B4%9A.json`)
                        .then(res => res.json())
                        .then(data => {
                            data.forEach(item => {
                                vocabulary.push({
                                    id: item.word,
                                    level: i,
                                    en: item.word,
                                    defs: item.definitions
                                });
                            });
                        })
                );
            }
            await Promise.all(fetchPromises);
            dataLoaded = true;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('level-grid').style.display = 'grid';
            renderLevels();
        } catch (error) {
            document.getElementById('loading').innerText = '載入資料失敗，請檢查網路連線或嘗試重新整理。';
            console.error('Failed to load vocabulary data:', error);
        }
    }

    function saveProgress() {
        localStorage.setItem('vocab_progress_v2', JSON.stringify(progress));
    }

    function getProgress(id) {
        let p = progress[id];
        if (p === true) return { memorized: true }; // handle legacy
        return p || {};
    }

    function renderLevels() {
        if (!dataLoaded) return;
        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        
        for (let i = 1; i <= 6; i++) {
            const levelWords = vocabulary.filter(w => w.level === i);
            const total = levelWords.length;
            if (total === 0) continue;
            
            let memorizedCount = 0;
            let hardCount = 0;
            
            levelWords.forEach(w => {
                const p = getProgress(w.id);
                if (p.memorized) memorizedCount++;
                else if (p.hard) hardCount++;
            });
            
            const percent = total === 0 ? 0 : Math.round((memorizedCount / total) * 100);
            
            const card = document.createElement('div');
            card.className = 'level-card';
            
            // Main New Words Section
            const mainBtn = document.createElement('div');
            mainBtn.className = `level-main ${percent === 100 ? 'completed' : ''}`;
            mainBtn.onclick = () => startLevel(i, 'new');
            
            mainBtn.innerHTML = `
                <div class="level-header">
                    <span>Level ${i} (學習新字)</span>
                    <span class="progress-text">${memorizedCount} / ${total} (${percent}%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${percent}%"></div>
                </div>
            `;
            card.appendChild(mainBtn);
            
            // Hard Words Section
            if (hardCount > 0) {
                const hardBtn = document.createElement('div');
                hardBtn.className = 'level-hard';
                hardBtn.onclick = () => startLevel(i, 'hard');
                
                hardBtn.innerHTML = `
                    <span class="hard-text">🔥 ${hardCount} 個不熟單字</span>
                    <button class="btn-small">加強複習</button>
                `;
                card.appendChild(hardBtn);
            }
            
            
            grid.appendChild(card);
        }

        // Animate title and level cards only once
        if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            if (!hasAnimatedTitle) {
                gsap.from("#level-screen h1, #level-screen .subtitle, #level-screen .top-bar, #loading", {
                    opacity: 0,
                    y: 20,
                    duration: 0.5,
                    stagger: 0.08,
                    ease: "power2.out",
                    clearProps: "all"
                });
                hasAnimatedTitle = true;
            }
            if (!hasAnimatedLevels && grid.children.length > 0) {
                gsap.from(grid.children, {
                    opacity: 0,
                    y: 20,
                    duration: 0.5,
                    stagger: 0.08,
                    ease: "power2.out",
                    clearProps: "all",
                    delay: 0.2 // slightly after title
                });
                hasAnimatedLevels = true;
            }
        }
    }

    function startLevel(level, mode) {
        const levelWords = vocabulary.filter(w => w.level === level);
        
        let targetWords = [];
        if (mode === 'hard') {
            targetWords = levelWords.filter(w => {
                return getProgress(w.id).hard === true;
            });
        } else {
            // 'new' mode: words that are neither memorized nor marked as hard
            targetWords = levelWords.filter(w => {
                const p = getProgress(w.id);
                return !p.memorized && !p.hard;
            });
        }
        
        if (targetWords.length === 0) {
            if (mode === 'hard') {
                alert('太棒了！目前這個等級沒有不熟的單字。');
            } else {
                alert(`Level ${level} 的新單字已經全部看完囉！請多加利用下方的「🔥 不熟單字」區來複習，或是點選右上角清除紀錄重新開始。`);
            }
            return;
        }
        
        // Shuffle
        reviewQueue = targetWords.sort(() => Math.random() - 0.5);
        
        switchScreen('card-screen');
        showNextWord();
        
        if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            gsap.from("#card-screen .top-bar, .card-container", {
                opacity: 0,
                y: 20,
                duration: 0.5,
                stagger: 0.08,
                ease: "power2.out",
                clearProps: "all"
            });
        }
    }

    function showNextWord() {
        if (reviewQueue.length === 0) {
            switchScreen('complete-screen');
            return;
        }
        
        currentWord = reviewQueue[0];
        document.getElementById('session-progress').innerText = `剩餘：${reviewQueue.length} 字`;
        document.getElementById('word-en').innerText = currentWord.en;
        
        const zhContainer = document.getElementById('word-zh-container');
        zhContainer.innerHTML = '';
        
        currentWord.defs.forEach(def => {
            const wrapper = document.createElement('div');
            wrapper.style.marginBottom = '15px';
            
            const pos = document.createElement('div');
            pos.className = 'word-pos';
            pos.innerText = def.partOfSpeech ? def.partOfSpeech + '.' : '';
            
            const text = document.createElement('div');
            text.className = 'word-zh';
            text.innerText = def.text;
            
            wrapper.appendChild(pos);
            wrapper.appendChild(text);
            zhContainer.appendChild(wrapper);
        });
    }

    function flipCard() {
        if (isAnimating) return;
        const card = document.getElementById('flashcard');
        if (!card.classList.contains('is-flipped')) {
            card.classList.add('is-flipped');
            document.getElementById('actions').classList.add('show');
        }
    }

    function handleAnswer(remembered) {
        if (isAnimating) return;
        isAnimating = true;
        
        document.getElementById('actions').classList.remove('show');
        
        // Update progress based on answer
        if (remembered) {
            progress[currentWord.id] = { memorized: true };
        } else {
            progress[currentWord.id] = { hard: true };
        }
        saveProgress();
        
        // Remove from current session queue
        reviewQueue.shift();
        
        const card = document.getElementById('flashcard');
        card.classList.remove('is-flipped');
        
        setTimeout(() => {
            showNextWord();
            isAnimating = false;
        }, 500); 
    }

    function goHome() {
        renderLevels();
        switchScreen('level-screen');
        reviewQueue = [];
        const card = document.getElementById('flashcard');
        card.classList.remove('is-flipped');
        document.getElementById('actions').classList.remove('show');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function resetAllProgress() {
        if(confirm('確定要清除所有學習記錄嗎？')) {
            progress = {};
            saveProgress();
            renderLevels();
        }
    }

    // Init
    loadData();

    // ==========================================
    // Three.js Background Animation
    // ==========================================
    function initThreeJS() {
        // Condition 4: Stop animation if "prefers-reduced-motion" is active
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        // Condition 3: Reduce particle count on mobile
        const isMobile = window.innerWidth < 768;
        const particleCount = isMobile ? 150 : 600;

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 200;
            positions[i + 1] = (Math.random() - 0.5) * 200;
            positions[i + 2] = (Math.random() - 0.5) * 100;

            velocities.push({
                x: (Math.random() - 0.5) * 0.05,
                y: (Math.random() - 0.5) * 0.05,
                z: (Math.random() - 0.5) * 0.05
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0xb8997a, // Matches Muji wood tone
            size: isMobile ? 1.5 : 1.2,
            transparent: true,
            opacity: 0.3,
            sizeAttenuation: true
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        function animate() {
            if (prefersReducedMotion) return;
            requestAnimationFrame(animate);

            const positionsAttribute = geometry.getAttribute('position');
            for (let i = 0; i < particleCount; i++) {
                let x = positionsAttribute.getX(i);
                let y = positionsAttribute.getY(i);
                let z = positionsAttribute.getZ(i);
                
                const vel = velocities[i];
                x += vel.x;
                y += vel.y;
                z += vel.z;

                if (x < -100 || x > 100) vel.x *= -1;
                if (y < -100 || y > 100) vel.y *= -1;
                if (z < -50 || z > 50) vel.z *= -1;

                positionsAttribute.setXYZ(i, x, y, z);
            }
            positionsAttribute.needsUpdate = true;

            particles.rotation.x += 0.0002;
            particles.rotation.y += 0.0003;

            renderer.render(scene, camera);
        }
        
        renderer.render(scene, camera); // Initial render
        if (!prefersReducedMotion) animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (prefersReducedMotion) renderer.render(scene, camera);
        });
    }

    initThreeJS();
</script>
</body>
</html>
